<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PriyamX Media Launch</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  overflow:hidden;
  background:#020617;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #00f5ff55, transparent 30%),
    radial-gradient(circle at 80% 70%, #8b5cf655, transparent 35%),
    linear-gradient(135deg,#020617,#000);
  animation:bgMove 10s ease-in-out infinite;
}

.particles span{
  position:absolute;
  width:4px;
  height:4px;
  background:#00f5ff;
  border-radius:50%;
  box-shadow:0 0 12px #00f5ff;
  animation:float 10s linear infinite;
}

.particles span:nth-child(1){left:10%;animation-delay:0s}
.particles span:nth-child(2){left:20%;animation-delay:1s}
.particles span:nth-child(3){left:35%;animation-delay:2s}
.particles span:nth-child(4){left:50%;animation-delay:.5s}
.particles span:nth-child(5){left:65%;animation-delay:1.5s}
.particles span:nth-child(6){left:80%;animation-delay:2.5s}
.particles span:nth-child(7){left:90%;animation-delay:3s}

.content{
  position:relative;
  text-align:center;
  z-index:2;
  animation:finalZoom 10s ease forwards;
}

.small{
  font-size:18px;
  letter-spacing:8px;
  color:#67e8f9;
  opacity:0;
  animation:show 1s ease forwards;
}

.logo{
  margin-top:20px;
  font-size:75px;
  font-weight:900;
  letter-spacing:6px;
  background:linear-gradient(90deg,#fff,#00f5ff,#a78bfa,#fff);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 40px #00f5ff77;
  opacity:0;
  transform:scale(.4);
  animation:logoReveal 2s ease forwards;
  animation-delay:1s;
}

.line{
  width:0;
  height:5px;
  margin:25px auto;
  background:linear-gradient(90deg,#00f5ff,#a78bfa);
  border-radius:50px;
  box-shadow:0 0 25px #00f5ff;
  animation:lineGrow 2s ease forwards;
  animation-delay:3s;
}

.tagline{
  font-size:26px;
  letter-spacing:3px;
  color:#e5e7eb;
  opacity:0;
  animation:showUp 1.5s ease forwards;
  animation-delay:4.5s;
}

.launch{
  margin-top:35px;
  font-size:22px;
  color:#22c55e;
  letter-spacing:5px;
  opacity:0;
  animation:pulse 2s ease infinite, show 1s ease forwards;
  animation-delay:6.2s;
}

.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  animation:flash 10s ease forwards;
  z-index:5;
}

@keyframes bgMove{
  0%,100%{filter:hue-rotate(0deg)}
  50%{filter:hue-rotate(80deg)}
}

@keyframes float{
  from{top:110%;opacity:0}
  20%{opacity:1}
  to{top:-10%;opacity:0}
}

@keyframes show{
  to{opacity:1}
}

@keyframes logoReveal{
  to{opacity:1;transform:scale(1)}
}

@keyframes lineGrow{
  to{width:420px}
}

@keyframes showUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes pulse{
  0%,100%{text-shadow:0 0 10px #22c55e}
  50%{text-shadow:0 0 35px #22c55e}
}

@keyframes finalZoom{
  0%,75%{transform:scale(1)}
  100%{transform:scale(1.2)}
}

@keyframes flash{
  0%,88%{opacity:0}
  92%{opacity:.85}
  100%{opacity:0}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="particles">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<div class="content">
  <div class="small">OFFICIAL LAUNCH</div>
  <div class="logo">PRIYAMX MEDIA</div>
  <div class="line"></div>
  <div class="tagline">Helping Local Businesses Grow Digitally</div>
  <div class="launch">WEBSITE IS LIVE</div>
</div>

<div class="flash"></div>

</body>
</html>
